<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tamagotchi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game">
      <h1>My Tamagotchi</h1>
      <button id="mute-btn">🔊</button>

      <div id="pet">🐶</div>
      <p id="stage"></p>

      <div id="stats">
        <div class="stat">
          <p>Hunger: <span id="hunger">50</span></p>
          <div class="bar"><div class="fill" id="hunger-fill"></div></div>
        </div>
        <div class="stat">
          <p>Happiness: <span id="happiness">50</span></p>
          <div class="bar"><div class="fill" id="happiness-fill"></div></div>
        </div>
        <div class="stat">
          <p>Energy: <span id="energy">50</span></p>
          <div class="bar"><div class="fill" id="energy-fill"></div></div>
        </div>
      </div>

      <div id="buttons">
        <button id="feed-btn">Feed</button>
        <button id="play-btn">Play</button>
        <button id="sleep-btn">Sleep</button>
        <button id="medicine-btn">Medicine</button>
        <button id="restart-btn" hidden>Restart</button>
        <button id="pause-btn">Pause</button>
      </div>

      <div id="pause-menu" hidden>
        <p>⏸ Game paused</p>
        <button id="resume-btn">Resume</button>
        <button id="pause-restart-btn">Restart</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
